name: Shadow AI CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff httpx

      # ── Ruff lint ─────────────────────────────────────────────────────────
      - name: Lint with ruff
        run: |
          ruff check . --select E,W,F --ignore E501,E402 --exclude mvenv,ttenv

      # ── Run tests ─────────────────────────────────────────────────────────
      - name: Run unit & integration tests
        env:
          SHADOW_DB_URL: sqlite:///./ci_test.db
          SHADOW_LOG_RAW_PROMPTS: "false"
          SHADOW_JWT_SECRET: "ci-test-secret-not-for-production"
          OPENAI_API_KEY: "sk-test-mock"       # Gateway falls back to mock LLM
        run: |
          pytest tests/ -v --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --ignore=tests/test_gateway.py   # Gateway integration skipped in CI (no full DB)

      # ── Gateway integration (optional, full stack) ────────────────────────
      - name: Run gateway integration tests
        env:
          SHADOW_DB_URL: sqlite:///./ci_gateway_test.db
          SHADOW_LOG_RAW_PROMPTS: "false"
          SHADOW_JWT_SECRET: "ci-test-secret-not-for-production"
          OPENAI_API_KEY: "sk-test-mock"
        run: |
          pytest tests/test_gateway.py -v --tb=short || true   # Non-fatal for now

      # ── Upload coverage ───────────────────────────────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t shadow-ai-gateway:ci .

      - name: Smoke test container
        run: |
          docker run -d \
            -e SHADOW_DB_URL="sqlite:////tmp/shadow_ci.db" \
            -e SHADOW_JWT_SECRET="ci-docker-secret" \
            -p 8000:8000 \
            --name shadow-ci \
            shadow-ai-gateway:ci
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs shadow-ci && exit 1)
          docker stop shadow-ci
